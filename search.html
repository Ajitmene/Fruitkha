<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fruitkha</title>
    <link rel="icon" href="logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        body{
            background-color: rgb(3, 2, 21);
        }
    </style>
</head>

<body>

    <section class="vh-100 d-flex justify-content-center align-items-center position-relative" onclick="window.history.back()">

        <button class="btn-close btn-close-white position-absolute top-0 end-0 m-4"></button>

        <div class="text-center w-100">
            <form>
                <p class="text-light fs-2 mb-4">Search For:</p>
                <input type="text"
                    class="form-control text-center border-0 border-bottom shadow-none w-75 mx-auto fs-3 py-3" style="background-color: rgb(3, 2, 21);"
                    placeholder="Search Keywords">
                <button class="btn btn-warning mt-4 px-5 py-2 fw-bold rounded-pill">
                    Search <i class="fa-solid fa-magnifying-glass ms-2"></i>
                </button>

            </form>
        </div>

    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
